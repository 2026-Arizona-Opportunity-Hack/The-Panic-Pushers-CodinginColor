<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My learning · CIC Classroom</title>
  <meta name="description" content="Your modules, what is next, and how far you have come.">
  <meta name="theme-color" content="#007A3D">
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/components-interactive.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/motion.css">
  <link rel="stylesheet" href="/css/pages/learn.css">
  <script type="module" src="/js/pages/learn.js"></script>
</head>
<body>
  <main id="main" class="container learn" tabindex="-1">
    <section class="glass-strong learn-hero" aria-labelledby="learn-title" aria-busy="true">
      <div class="learn-hero-text">
        <p class="eyebrow" id="learn-class">Your class</p>
        <h1 id="learn-title">My learning</h1>
        <p class="muted" id="learn-sub">Loading your modules…</p>
        <div class="cluster" id="learn-cta"></div>
      </div>
      <div class="learn-hero-ring" id="learn-ring"></div>
    </section>
    <h2 class="learn-h2">Your path</h2>
    <ol class="journey" id="journey" aria-label="Modules in order">
      <li class="skeleton journey-skel"></li><li class="skeleton journey-skel"></li><li class="skeleton journey-skel"></li>
    </ol>
  </main>
</body>
</html>

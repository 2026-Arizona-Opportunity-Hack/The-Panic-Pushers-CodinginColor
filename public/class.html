<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class · CIC Classroom</title>
  <meta name="description" content="Who needs help today, the roster and learning gain for one class.">
  <meta name="theme-color" content="#007A3D">
  <script src="/js/boot.js"></script>
  <link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/components-interactive.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/motion.css">
  <link rel="stylesheet" href="/css/pages/teach.css">
  <script type="module" src="/js/pages/class.js"></script>
</head>
<body>
  <main id="main" class="container teach" tabindex="-1">
    <nav aria-label="Breadcrumb"><a href="/teach.html" class="btn btn-ghost btn-sm teach-back"><span data-icon="chevron-left"></span> My classes</a></nav>
    <header class="teach-head">
      <div>
        <p class="eyebrow" id="class-meta">Class</p>
        <h1 id="class-title">Loading…</h1>
      </div>
      <div class="cluster" id="class-tools"></div>
    </header>
    <section class="stat-row" id="stats" aria-label="Class at a glance"></section>
    <div class="dash">
      <section class="glass-strong dash-card" aria-labelledby="today-title">
        <div class="dash-card-head"><h2 id="today-title">Today</h2><span class="muted text-sm">Who needs you first</span></div>
        <ul class="today" id="today"></ul>
      </section>
      <section class="glass-strong dash-card" aria-labelledby="gain-title">
        <div class="dash-card-head"><h2 id="gain-title">Learning gain</h2><span class="muted text-sm">Pretest to post-test, students with both</span></div>
        <div id="gain"></div>
      </section>
    </div>
    <section class="glass-strong dash-card" aria-labelledby="roster-title">
      <div class="dash-card-head"><h2 id="roster-title">Roster</h2><div id="filters"></div></div>
      <div class="table-wrap"><table class="table roster" id="roster"></table></div>
    </section>
  </main>
</body>
</html>
